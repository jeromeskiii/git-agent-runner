[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_runner"]

[project]
name = "git-agent-runner"
version = "0.1.0"
description = "Orchestrator that wires git-worktree-runner and pr-agent together into a dynamic agent pipeline"
requires-python = ">=3.12"
dependencies = [
    "pr-agent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
agent-runner = "agent_runner.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.per-file-ignores]
"agent_runner/tests/*" = ["B", "SIM"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["agent_runner/tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["agent_runner"]
ignore_missing_imports = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "agent_runner.tests.*"
disallow_untyped_defs = false
